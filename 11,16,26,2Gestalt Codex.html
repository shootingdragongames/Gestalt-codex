<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f121b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Gestalt Codex: a D&D 5e character builder and sheet.">
<script>window.GC_WEB=true</script>
<title>Gestalt Codex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=Alegreya:ital,wght@0,400;0,700;1,400&family=Alegreya+Sans+SC:wght@500;700&display=swap">
<style>
/* Layout: sticky top bar (brand, tabs, character switcher) over one centered working column; track A = indigo, track B = persimmon throughout */
:root{
  /* paper sheet: deliberately fixed print colors in both themes */
  --pp-bg:#fdfcf8;--pp-ink:#1d1b18;--pp-line:#3a3631;--pp-soft:#ebe7de;--pp-muted:#6b665d;--pp-desk:#c9c4b8;
  --pp-serif:"Alegreya",Georgia,"Times New Roman",serif;--pp-sc:"Alegreya Sans SC","Gill Sans","Trebuchet MS",sans-serif;
  --bg:#eceff5;--panel:#fafbfd;--panel2:#f1f3f8;--ink:#1a2035;--muted:#586079;--line:#d3d8e4;
  --a:#2d3d8e;--a-soft:#e2e6f7;--b:#b4501b;--b-soft:#f8e6db;--ok:#2f7a4f;--warn:#a5600a;
  --disp:"Shippori Mincho B1",Georgia,"Times New Roman",serif;
  --body:"Zen Kaku Gothic New",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f121b;--panel:#171b27;--panel2:#1d2230;--ink:#e5e8f1;--muted:#9aa2b9;--line:#2b3144;
  --a:#9aa9ff;--a-soft:#232b4d;--b:#f2925a;--b-soft:#3a2518;--ok:#6cc893;--warn:#f0b25a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f121b;--panel:#171b27;--panel2:#1d2230;--ink:#e5e8f1;--muted:#9aa2b9;--line:#2b3144;
  --a:#9aa9ff;--a-soft:#232b4d;--b:#f2925a;--b-soft:#3a2518;--ok:#6cc893;--warn:#f0b25a;color-scheme:dark}
*{box-sizing:border-box}
html{font-size:18px}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.55}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.seal{width:34px;height:34px;display:grid;place-items:center;background:var(--b);color:var(--panel);font-family:var(--disp);font-weight:800;font-size:20px;border-radius:3px}
h1{font-family:var(--disp);font-weight:800;font-size:1.25rem;margin:0;line-height:1.1;letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tabs button{border:0;background:none;color:var(--muted);font:inherit;font-weight:500;padding:6px 10px;border-radius:4px;cursor:pointer;white-space:nowrap}
.tabs button[aria-current="true"]{color:var(--ink);background:var(--panel2);box-shadow:inset 0 -2px 0 var(--a)}
.fsz{display:flex;gap:2px}
.fsz button{font:inherit;font-weight:700;font-size:.85rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:2px 9px;border-radius:4px;cursor:pointer}
.fsz button:hover{border-color:var(--a)}
.charbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:8px 0}
.charbar select{flex:1 1 220px;min-width:0}
main.wrap{padding-block:16px 64px;display:flex;flex-direction:column;gap:16px}
section.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
h2{font-family:var(--disp);font-weight:800;font-size:1.1rem;margin:0 0 12px;text-wrap:balance}
h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 8px;font-weight:700}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--muted);letter-spacing:.03em;min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:7px 9px;min-width:0;width:100%}
textarea{font-family:var(--mono);font-size:.82rem;min-height:90px;resize:vertical}
input[type=checkbox]{width:20px;height:20px;min-width:20px;min-height:20px;flex:0 0 20px;margin:0;accent-color:var(--a);padding:0;align-self:center}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--a);outline-offset:1px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:4px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--a)}
.btn.pri{background:var(--a);border-color:var(--a);color:var(--panel)}
.btn.pri.b{background:var(--b);border-color:var(--b)}
td.here{background:var(--a-soft);font-weight:700}
.btn.danger{color:var(--b);border-color:var(--b)}
.btn.sm{padding:3px 8px;font-size:.8rem}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.stat b{display:block;font-family:var(--mono);font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tag{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:3px;font-size:.75rem;font-weight:700;font-family:var(--mono);background:var(--panel2);color:var(--muted);vertical-align:1px}
.tag.A{background:var(--a);color:var(--panel)}
.tag.B{background:var(--b);color:var(--panel)}
.tracks{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.track{border-top:3px solid var(--a)}
.track.B{border-top-color:var(--b)}
.track h2{display:flex;gap:8px;align-items:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:.85rem;margin-top:10px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.76rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td input[type=number]{width:70px}
tr.cur td{background:var(--a-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:3px 9px;border-radius:999px;cursor:pointer}
.chip.in{border-color:var(--a);background:var(--a-soft)}
.chip.prep{border-color:var(--a);background:var(--a);color:var(--panel)}
.warn{color:var(--warn)}
.ok{color:var(--ok)}
details.lvl{border-top:1px solid var(--line);padding-block:6px}
details.lvl summary{cursor:pointer;font-weight:500}
.feat{display:grid;grid-template-columns:38px 1fr;gap:10px;padding-block:8px;border-bottom:1px solid var(--line)}
.feat:last-child{border-bottom:0}
.feat .lv{font-family:var(--mono);font-size:.8rem;color:var(--muted);padding-top:2px}
.feat p{margin:2px 0 0;color:var(--muted);font-size:.86rem;max-width:65ch}
.feat .nm{font-weight:700}
.abils{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media (max-width:560px){.abils{grid-template-columns:repeat(3,1fr)}}
.ab{border:1px solid var(--line);border-radius:6px;text-align:center;padding:8px 4px;background:var(--panel2)}
.ab .k{font-size:.7rem;letter-spacing:.1em;color:var(--muted);font-weight:700}
.ab .m{font-family:var(--mono);font-size:1.4rem;font-weight:600}
.ab .s{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.ab .sv{font-size:.72rem;margin-top:4px}
.ab .sv.p{color:var(--a);font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:6px;font-size:.88rem;max-width:min(92vw,520px);box-shadow:0 4px 18px rgba(0,0,0,.25)}
.qbar{background:var(--panel2);border-radius:6px;padding:8px 10px;margin-bottom:6px}
select[data-act="spAddSel"]{max-width:340px;flex:1 1 220px}
.pools{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.pool{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--panel)}
.pool.open{border-color:var(--a);box-shadow:inset 3px 0 0 var(--a)}
.pool .ph{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-bottom:6px}
.pill{font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--a);color:var(--panel)}
.pill.done{background:var(--panel2);color:var(--muted)}
.chip.pk{font-size:.8rem}
.chip.pk.on{background:var(--a);border-color:var(--a);color:var(--panel)}
.chip.pk.can{border:1px dashed var(--a);color:var(--a);background:var(--a-soft)}
.chip.pk.has{opacity:.6;cursor:default}
.chip.pk.has small{color:var(--muted);font-size:.68rem}
.chip.pk.off{opacity:.35;cursor:default}
tr.avail td{background:var(--a-soft)}
tr.dim td{opacity:.5}
.coins{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:560px){.coins{grid-template-columns:repeat(3,minmax(0,1fr))}}
.coin input{font-family:var(--mono);font-weight:600;font-size:1.05rem}
.coin.gp input{border-color:var(--warn)}
.abpanel{margin-top:14px;border:1px solid var(--line);border-radius:6px;padding:8px 12px;background:var(--panel)}
.abpanel summary{cursor:pointer}
.abpanel table{margin-top:6px}
tr.chg td,tr.chg th{background:var(--a-soft)}
.picked{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.picked .opt{flex:0 1 340px;cursor:default}
.invrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding-block:8px;border-bottom:1px solid var(--line)}
.invrow:last-child{border-bottom:0}
.chsel{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr));gap:6px;max-width:min(640px,100%);min-width:0}
.feat>div{min-width:0}.feat p{overflow-wrap:anywhere}#view{min-width:0}#view>*{max-width:100%}
.hpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px}
.trk{padding-block:10px;border-bottom:1px solid var(--line)}
.trk:last-child{border-bottom:0}
.trk-top{display:flex;justify-content:space-between;gap:8px}
.bar{height:8px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:6px}
.bar span{display:block;height:100%;background:var(--b)}
.bar.xp span{background:var(--a)}
.bar.hp{height:12px}
.bar.hp span{background:var(--ok)}
.bar.hp.mid span{background:var(--warn)}
.bar.hp.low span{background:var(--b)}
.pip.fail{border-color:var(--b)}
.pip.fail:not(.used){background:var(--b)}
.pip{width:18px;height:18px;border:2px solid var(--a);border-radius:50%;background:var(--a);cursor:pointer;padding:0}
.pip.used{background:transparent}
.slotrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:4px}
.slotrow .l{font-family:var(--mono);font-size:.8rem;width:44px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.libitem{display:flex;gap:8px;align-items:center;justify-content:space-between;padding-block:8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.libitem .nm{font-weight:700}
.badge{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;padding:1px 6px;border-radius:3px;background:var(--panel2);color:var(--muted)}
.badge.c{background:var(--b-soft);color:var(--b)}
.checks{display:flex;flex-wrap:wrap;gap:4px 12px}
.checks label{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--ink)}
.hint{font-size:.84rem;color:var(--muted)}
.two{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.note{background:var(--panel2);border-radius:4px;padding:10px 12px;font-size:.85rem;color:var(--muted)}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.opt{text-align:left;font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--a)}
.opt.B:hover{border-color:var(--b)}
.opt.on{border-color:var(--a);background:var(--a-soft);box-shadow:inset 0 0 0 1px var(--a)}
.opt.B.on{border-color:var(--b);background:var(--b-soft);box-shadow:inset 0 0 0 1px var(--b)}
.ot{font-weight:700}
.ol{font-size:.86rem;color:var(--muted);overflow-wrap:anywhere}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px}
.steps button{font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:4px 10px;border-radius:999px;cursor:pointer}
.steps button.done{color:var(--ink);border-color:var(--a)}
.steps button.now{background:var(--a);border-color:var(--a);color:var(--panel);font-weight:700}
.steps button:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper .btn{width:32px;height:32px;padding:0}
.stepper b{min-width:2ch;text-align:center}
tr.key th{color:var(--a)}
.wnav{position:sticky;bottom:env(safe-area-inset-bottom,0px);z-index:4;background:var(--bg);border-top:1px solid var(--line);padding-block:10px;display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
/* paper sheet */
.pdesk{overflow-x:auto;background:var(--pp-desk);border-radius:6px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:16px}
.page{flex:0 0 auto;width:816px;height:1056px;background:var(--pp-bg);color:var(--pp-ink);font-family:var(--pp-serif);font-size:12px;line-height:1.3;padding:34px 36px;box-shadow:0 2px 10px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:10px;overflow:hidden}
.page .pl{font-family:var(--pp-sc);font-size:9px;letter-spacing:.06em;color:var(--pp-muted);text-transform:lowercase;text-align:center;line-height:1.1;margin-top:2px}
.page .pl.top{margin:0 0 2px}
.phead{display:grid;grid-template-columns:1fr 1.7fr;gap:12px;align-items:stretch}
.phead.slim{grid-template-columns:1fr}
.pname{border:1.5px solid var(--pp-line);border-radius:8px 0 0 8px;padding:10px 12px 6px;display:flex;flex-direction:column;justify-content:flex-end;position:relative}
.pbrand{position:absolute;top:6px;left:12px;font-family:var(--pp-sc);font-size:8px;letter-spacing:.12em;color:var(--pp-muted)}
.pv{font-size:13px;border-bottom:1px solid var(--pp-line);min-height:18px;padding-inline:2px;overflow-wrap:anywhere}
.pv.big{font-size:20px;font-weight:700;min-height:28px}
.pinfo{border:1.5px solid var(--pp-line);border-radius:0 8px 8px 0;padding:8px 12px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px 12px}
.pf .pl{text-align:left}
.pcols{flex:1;display:grid;grid-template-columns:262px 238px 1fr;gap:10px;min-height:0}
.pcols.two{grid-template-columns:1fr 1fr}
.pcols>div{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.pc1{display:grid!important;grid-template-columns:76px 1fr;grid-template-rows:1fr auto auto;gap:8px}
.pc1>.pinl.wide,.pc1>.pbox{grid-column:1/-1}
.pabs{display:flex;flex-direction:column;gap:6px;background:var(--pp-soft);border-radius:8px;padding:6px 5px}
.pab{border:1.5px solid var(--pp-line);border-radius:8px;background:var(--pp-bg);text-align:center;padding:4px 2px 0;display:flex;flex-direction:column;align-items:center;flex:1;justify-content:center}
.pmod{font-size:24px;font-weight:700;line-height:1}
.pscore{border:1.5px solid var(--pp-line);border-radius:999px;background:var(--pp-bg);font-size:12px;min-width:34px;padding:0 4px;margin:3px 0 -9px;position:relative}
.pc1r{display:flex;flex-direction:column;gap:6px;min-height:0}
.pinl{display:flex;align-items:center;gap:8px;border:1.5px solid var(--pp-line);border-radius:8px;padding:3px 8px}
.pinl .pl{text-align:left;margin:0}
.pbig{font-size:20px;font-weight:700;line-height:1.1;text-align:center}
.pinl .pbig{min-width:30px}
.pbox{border:1.5px solid var(--pp-line);border-radius:8px;padding:6px 8px 4px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pbox.grow{flex:1}
.pbox .pbody{flex:1;min-height:0;overflow:hidden}
.pbox.list .prow{font-size:11px}
.prow{display:flex;align-items:center;gap:4px;padding-block:1px;white-space:nowrap}
.prow .pn{display:inline-block;min-width:24px;border-bottom:1px solid var(--pp-line);text-align:center;margin-right:4px}
.pm{color:var(--pp-muted);font-size:9.5px}
.dot{display:inline-block;width:9px;height:9px;border:1.2px solid var(--pp-line);border-radius:50%;flex:0 0 auto;vertical-align:-1px}
.dot.on{background:var(--pp-ink)}
.page .small{font-size:10.5px}
.ptrio{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ptrio.inline{border:1.5px solid var(--pp-line);border-radius:0 8px 8px 0;padding:8px}
.pshield,.psq{border:1.5px solid var(--pp-line);border-radius:8px;padding:6px 4px 4px;text-align:center}
.pshield{border-radius:8px 8px 40% 40%}
.pmax{font-size:10px;color:var(--pp-muted);border-bottom:1px solid var(--pp-line);padding-bottom:2px}
.pmax b{color:var(--pp-ink);font-size:12px}
.phpv{min-height:34px;font-size:22px;font-weight:700;text-align:center;padding-top:4px}
.phpv.sm{min-height:26px}
.ppair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ptab{width:100%;border-collapse:collapse;font-size:10.5px}
.ptab th{font-family:var(--pp-sc);font-weight:500;font-size:8.5px;color:var(--pp-muted);text-align:left;padding:0 3px;border:0}
.ptab td{background:var(--pp-soft);padding:2px 4px;border:0;border-bottom:3px solid var(--pp-bg)}
.ptab .c{text-align:center}
.peq{display:grid;grid-template-columns:60px 1fr;gap:8px;height:100%}
.pcoins{display:flex;flex-direction:column;gap:3px}
.pcoin{border:1.2px solid var(--pp-line);border-radius:6px;text-align:center;font-size:9px;line-height:1.1;padding:1px}
.pcoin span{display:block;font-family:var(--pp-sc);color:var(--pp-muted)}
.pcoin b{display:block;min-height:12px;font-size:11px}
.fi{margin-bottom:4px;font-size:10.5px}
.fi i{color:var(--pp-muted)}
.flow{height:100%;overflow:hidden}
.pfoot{font-family:var(--pp-sc);font-size:9px;color:var(--pp-muted);text-align:center}
.page .pspells{flex:1 1 0;height:0;min-height:0;column-count:3;column-gap:12px;column-fill:auto}
.page .pbox .flow.pspells{height:100%;flex:none}

const EQ_TOK={'@simple':['Simple weapon',w=>w.wk==='S'||w.wk==='SR'],'@simpleMelee':['Simple melee weapon',w=>w.wk==='S'],'@martial':['Martial weapon',w=>w.wk==='M'||w.wk==='MR'],'@martialMelee':['Martial melee weapon',w=>w.wk==='M'],'@instrument':['Instrument',null]};
function eqParts(opt){return opt.split(' + ').map(x=>{const m=x.match(/^(\d+) (.+)$/);return m?{q:+m[1],n:m[2]}:{q:1,n:x}})}
function vClassGear(ch,R){const t=R.tracks.find(x=>x.k===(ui.cgK||'A'))||R.tracks[0];if(!t)return '';const E=lib.classes?.find(c=>c.name===t.c.name&&c.equip)?null:CLASS_EQUIP[t.c.name];if(!E)return '';const pick=ch.cgPick?.[t.c.name]||{};
  const W=Object.values(itemMap()).filter(w=>w.dmg&&w.dmg!=='—'&&w.wk);let tok=0;
  const optLabel=o=>o.split(' + ').map(x=>EQ_TOK[x.replace(/^\d+ /,'')]?.[0]||x).join(' + ');
  const groups=E.map((g,gi)=>{const sel_=+pick['g'+gi]||0,opt=g[Math.min(sel_,g.length-1)];
    const choose=g.length>1?`<select data-b="cgPick.${esc(t.c.name)}.g${gi}" aria-label="Choice ${gi+1}" style="width:auto">${g.map((o,oi)=>`<option value="${oi}"${oi===sel_?' selected':''}>(${'abc'[oi]}) ${esc(optLabel(o))}</option>`).join('')}</select>`:`<span class="small">${esc(optLabel(opt))}</span>`;
    const toks=eqParts(opt).map((x,pi)=>{const T=EQ_TOK[x.n];if(!T)return '';const k=`w${gi}_${pi}`;const cur=pick[k]||'';return T[1]?`<select data-b="cgPick.${esc(t.c.name)}.${k}" aria-label="${esc(T[0])}" style="width:auto"><option value="">${esc(T[0])}…</option>${W.filter(T[1]).map(w=>`<option${w.name===cur?' selected':''}>${esc(w.name)}</option>`).join('')}</select>`:`<input data-b="cgPick.${esc(t.c.name)}.${k}" data-live value="${esc(cur)}" placeholder="Which ${esc(T[0].toLowerCase())}?" style="width:180px">`}).join('');
    return `<div class="row" style="gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)"><span class="small muted" style="min-width:20px">${gi+1}.</span>${choose}${toks}</div>`}).join('');
  const added=ch.cgAdded?.[t.c.name];
  return `<section class="card"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">Class starting gear · ${esc(t.c.name)}</h2><div class="row" style="gap:6px">${R.tracks.length>1?R.tracks.map(x=>`<button class="btn sm ${x===t?'pri':''}" data-act="cgK" data-k="${x.k}">${esc(x.c.name)}</button>`).join(''):''}${added?`<span class="small ok">Added ✓</span>`:''}</div></div>
   <p class="hint" style="margin:6px 0">Pick each (a)/(b) option the way the ${esc(t.c.name)} class lists it, then add it all at once. "If proficient" options are your call.${R.tracks.length>1?' Gestalt and dual characters usually only take one class\'s gear; ask your DM.':''}</p>${groups}
   <div class="row" style="margin-top:8px;gap:6px"><button class="btn ${added?'':'pri'}" data-act="cgAdd" data-c="${esc(t.c.name)}">${added?'Add again':'Add to inventory'}</button></div></section>`}
function parseGear(t){const items=[];let gp=0;String(t||'').split(/[;,](?![^()]*\))/).map(x=>x.trim()).filter(Boolean).forEach(x=>{const m=x.match(/^(\d+(?:\.\d+)?)\s*(gp|sp|cp|ryo)$/i);if(m){gp+=+m[1]*({gp:1,sp:0.1,cp:0.01,ryo:1}[m[2].toLowerCase()]);return}const q=x.match(/^(\d+)\s+(.+)$/);items.push(q&&!/^\d+ (feet|ft)/.test(q[2])?{n:q[2],q:+q[1]}:{n:x,q:1})});return {items,gp}}
function bgGear(bg,ch,R){if(!bg)return null;let t=bg.equip||BG_EQUIP[bg.name];if(!t)return null;
  if(ch&&R){const sl=toolInfo(ch,R).slots.filter(x=>x.src.startsWith('Background')&&x.val);const take=re=>{const i=sl.findIndex(x=>re.test(x.from));return i<0?null:sl.splice(i,1)[0].val};
    t=t.replace(/([A-Za-z' ]+?)\s*\(your choice\)/g,(m,nm)=>{const v=/artisan/i.test(nm)?take(/artisan/):/instrument|gaming/i.test(nm)?take(/instrument|gaming/):null;return v||m})}
  return parseGear(t)}
function bgChoiceFix(ch,R){const T=toolInfo(ch,R);const sl=T.slots.filter(x=>x.src.startsWith('Background')&&x.val);const ex=re=>T.extra.find(t=>(TOOLS[re]||[]).includes(t));const pick=k=>sl.find(x=>x.from===k||new RegExp(k).test(x.from))?.val||ex(k);
  return (ch.inv||[]).map((it,i)=>{const nm=it?.name||'';const kind=it?.bgTool||(/\(your choice\)/i.test(nm)?(/artisan/i.test(nm)?'artisan':/instrument/i.test(nm)?'instrument':/gaming/i.test(nm)?'gaming':null):null);if(!kind)return null;const v=pick(kind);return v&&v!==nm?{i,from:nm,to:v,kind}:null}).filter(Boolean)}
function bgAutoFix(ch,R){const F=bgChoiceFix(ch,R);if(!F.length)return;const IM=itemMap(),low={};Object.values(IM).forEach(x=>low[x.name.toLowerCase()]=x);F.forEach(x=>{const it=ch.inv[x.i];it.name=x.to;it.bgTool=x.kind;const h=low[x.to.toLowerCase()];if(h){it.cat=h.cat;it.cost=+h.cost||0}});persistSoon()}

function syncArmor(ch){if(!ch)return;{const p=artLvl(ch)>=10?2:1;(ch.magic||[]).forEach(e=>{if(e&&e.inf&&/^Enhanced /.test(e.name)&&e.infPlus!==p){e.infPlus=p;persistSoon()}})}const MM=magicMap();const ws=(ch.magic||[]).filter(e=>e&&e.worn&&MM[e.name]?.type==='Armor'&&e.base&&ARMOR[e.base]);if(ws.length&&!ws.some(e=>e.base===ch.armor)){ch.armor=ws[0].base;ch.mageArmor=false;persistSoon()}
  const sh=(ch.magic||[]).some(e=>e&&e.worn&&MM[e.name]?.type==='Shield');if(sh&&!ch.shield){ch.shield=true;persistSoon()}}

function vProg(ch,R){
  const rows=[];
  if(R.dual){for(let l=1;l<=20;l++){const r=calc({...ch,levelA:l,levelB:l});const at=k=>r.feat.filter(f=>f.src===k&&f.lvl===l).map(f=>esc(f.name)).join(', ')||'<span class="muted">—</span>';const here=k=>(k==='A'?R.LA:R.LB)===l?' class="here"':'';
      rows.push(`<tr><td class="n">${l}</td><td${here('A')}>${at('A')}</td><td${here('B')}>${at('B')}</td><td>${r.asiSlots.filter(s=>s.lvl===l).map(s=>tag(s.from[0])).join(' ')}</td></tr>`)}
    return `<section class="card"><h2>Class progression</h2><p class="hint">Dual progression: each class levels on its own. Highlighted cells are each class's current level (${esc(ch.classA)} ${R.LA}, ${esc(ch.classB)} ${R.LB}; character level ${R.L}).</p>
    <div class="tbl"><table><thead><tr><th class="n">Class lvl</th><th>${tag('A')} ${esc(ch.classA)}</th><th>${tag('B')} ${esc(ch.classB)}</th><th>ASI</th></tr></thead><tbody>${rows.join('')}</tbody></table></div></section>`}
  for(let L=1;L<=20;L++){const r=calc({...ch,level:L});const at=k=>r.feat.filter(f=>f.src===k&&f.lvl===L).map(f=>esc(f.name)).join(', ')||'<span class="muted">—</span>';const sl=r.asiSlots.find(s=>s.lvl===L);
    rows.push(`<tr class="${L===R.L?'cur':''}"><td class="n">${L}</td><td class="n">${sg(r.prof)}</td><td class="n">${r.hp}</td><td>${at('A')}</td>${R.single?'':`<td>${at('B')}</td>`}<td>${sl?sl.from.map(tag).join(' '):''}</td><td class="mono small">${slotStr(r.slots)}${r.pact?` · pact ${r.pact.n}×${ORD[r.pact.lv]}`:''}</td></tr>`)}
  return `<section class="card"><h2>1 to 20 progression</h2><p class="hint">${R.single?'':'Both tracks level together. '}HP uses your current scores. Your current level is highlighted.</p>
  <div class="tbl"><table><thead><tr><th class="n">Lvl</th><th class="n">Prof</th><th class="n">HP</th><th>${R.single?'Features':tag('A')+' '+esc(ch.classA)}</th>${R.single?'':`<th>${tag('B')} ${esc(ch.classB)}</th>`}<th>ASI</th><th>Slots</th></tr></thead><tbody>${rows.join('')}</tbody></table></div></section>`;
}

const WSTEPS=['House rules','Race','Classes','Abilities','Background & skills','Name & finish'];
const STD=[15,14,13,12,10,8];
function optCard(k,v,on,title,lines,cls=''){return `<button class="opt ${on?'on':''} ${cls}" data-act="wPick" data-k="${k}" data-v="${esc(v)}" aria-pressed="${on}"><span class="ot">${esc(title)}</span>${lines.filter(Boolean).map(l=>`<span class="ol">${l}</span>`).join('')}</button>`}
const W=s=>s.replace(/data-b=/g,'data-w=').replace(/id="i-/g,'id="w-');
function wBlock(step,d){if(step>=2&&!d.race)return 'Pick a race first.';if(step>=3&&(!d.classA||(d.rules?.mode!=='single'&&!d.classB)))return d.rules?.mode==='single'?'Pick a class.':'Pick a class for both tracks.';return ''}
function vWizard(){
  const {step,draft:d}=ui.wiz,R=calc(d),CM=classMap();ui.ctx={ch:d,R};
  const stepper=`<div class="steps">${WSTEPS.map((s,i)=>`<button data-act="wStep" data-s="${i}" class="${i===step?'now':i<step?'done':''}"${wBlock(i,d)?' disabled':''}>${i+1}. ${s}</button>`).join('')}</div>`;
  let body='',warn='';
  if(step===0){
    body=`<h2>House rules</h2><p class="hint">Set these to match your table first. Everything after this step follows them, and you can change them later under Build → House rules. New characters start from whatever you set last.</p>${W(rulesUI(d))}`;
  }

  else if(a==='atkFin'){const x=ch.attacks?.[+b.dataset.i];if(x){x.a='FIN';commit()}}

  else if(a==='rest'){ch.bof='';ch.cdUsed=0;ch.laUsed=0;ch.rsUsed={};ch.bsUsed=0;ch.bladesong=false;ch.kiUsed=0;ch.lohUsed=0;ch.hhUsed=false;ch.used={};ch.sp='';ch.sorcUsed=0;ch.adeptUsed=0;ch.bonusSlots={};ch.spHigh={};ch.det=ch.det||{};ch.det.hpCur='';ch.det.hpTemp='';ch.death={s:0,f:0};{const R=calc(ch);const back=Math.max(1,Math.floor(R.L/2));let left=back;ch.hdUsed=ch.hdUsed||{};hdPools(R).forEach(P=>{const u=ch.hdUsed[P.die]||0,g=Math.min(u,left);ch.hdUsed[P.die]=u-g;left-=g})}(ch.trackers||[]).forEach(t=>{if((t.rest||'long')!=='none')t.cur=''});ui.flash='Long rest: HP, slots, sorcery points, and resources refilled; half your hit dice back.';toast('Long rest taken.');commit()}
  else if(['sorc','adept','sorcSpend','metaUse','sorcMake','sorcBurn','bonusUse'].includes(a)){const R=calc(ch),S=sorcState(ch,R);if(!S&&a!=='bonusUse')return;let cu=S?S.clsUsed:0,au=S?S.adUsed:0;const left=()=>S.max-cu-au;

    else if(a==='sorcSpend'){const n=Math.floor(+document.getElementById('sorcAmt')?.value||0);if(n<=0){toast('Enter how many points.');return}if(!spendCls(n,'Spent'))return}
    else if(a==='metaUse'){const m=b.dataset.m;let c=META_COST[m];if(c==='lvl'){const v=Math.floor(+document.getElementById('sorcAmt')?.value||0);if(!v){toast(`Twinned costs the spell level: type the level in the box first (cantrip = 1).`);return}c=Math.max(1,v)}
      if(c>left()){toast(`Not enough points for ${m} (${c} needed, ${left()} left).`);return}const fromA=Math.min(c,S.adMax-au);au+=fromA;cu+=c-fromA;toast(`${m}: −${c}${fromA&&S.clsMax?` (${fromA} from Adept)`:''}. ${left()} left.`)}
    else if(a==='sorcMake'){const l=+document.getElementById('sorcMake')?.value||1;if(!spendCls(SP_COST[l],`Created a ${ORD[l]}-level slot`))return;const k='s'+l;if((ch.used?.[k]||0)>0)ch.used[k]--;else{ch.bonusSlots=ch.bonusSlots||{};ch.bonusSlots[l]=(+ch.bonusSlots[l]||0)+1}}
    else if(a==='sorcBurn'){const l=+document.getElementById('sorcBurn')?.value||0;if(!l)return;const gain=Math.min(l,cu);if(!gain){toast('Sorcery points are already full.');return}ch.used=ch.used||{};ch.used['s'+l]=(ch.used['s'+l]||0)+1;cu-=gain;toast(`Spent a ${ORD[l]}-level slot: +${gain} sorcery point${gain>1?'s':''}.`)}
    else if(a==='bonusUse'){const l=b.dataset.l;if(ch.bonusSlots?.[l]>0){ch.bonusSlots[l]--;toast(`Used a created ${ORD[l]}-level slot.`)}}
    ch.sorcUsed=cu;ch.adeptUsed=au;commit()}
  else if(a==='shortRest'){ch.kiUsed=0;ch.cdUsed=0;if(ch.used)delete ch.used.pact;(ch.trackers||[]).forEach(t=>{if(t.rest==='short')t.cur=''});ui.flash='Short rest: ki, pact slots, and short-rest resources refilled. Spend hit dice in Hit points to heal.';toast('Short rest taken.');commit()}
  else if(a==='xpAdd'){const v=Math.round(+document.getElementById('xpAmt')?.value||0);if(!v)return;const n=(document.getElementById('xpNote')?.value||'').trim();ch.xp=Math.max(0,(+ch.xp||0)+v);(ch.xpLog=ch.xpLog||[]).push({v,n});if(ch.xpLog.length>50)ch.xpLog.shift();commit()}
  else if(a==='xpUndo'){const e=(ch.xpLog||[]).pop();if(e)ch.xp=Math.max(0,(+ch.xp||0)-e.v);commit()}
  else if(a==='addTrk'){(ch.trackers=ch.trackers||[]).push({name:'New resource',f:'',cur:'',rest:'long'});commit()}
  else if(a==='addChakra'){(ch.trackers=ch.trackers||[]).push({name:'Chakra',f:'5 + level*3 + con + wis',cur:'',rest:'long'});commit()}
  else if(a==='delTrk'){ch.trackers.splice(+b.dataset.i,1);commit()}
  else if(a==='trk'||a==='trkSpend'||a==='trkFull'){const R=calc(ch),t=R.trk[+b.dataset.i];if(!t)return;let v=t.cur;if(a==='trk')v+= +b.dataset.d;else if(a==='trkFull')v=t.max;else{const n=+document.getElementById('sp-'+t.i)?.value||0;if(n>t.cur){ui.flash=`Not enough ${t.name}: ${t.cur} left.`;render();return}v-=n}ch.trackers[t.i].cur=Math.min(t.max,Math.max(0,v));ui.flash='';commit()}
  else if(a==='toggleExport'){ui.showExport=!ui.showExport;render()}
  else if(a==='libType'){ui.libType=b.dataset.t;ui.libQ='';ui.edit=null;ui.msg='';render()}

  else if(a==='libNew'){ui.edit={type:ui.libType,orig:null,vals:toForm(ui.libType,null)};ui.msg='';render();window.scrollTo(0,0)}
  else if(a==='libCopy'||a==='libEdit'){const t=ui.libType;const src=a==='libCopy'?srdOf(t):lib[t];const it=src.find(i=>keyOf(t,i)===b.dataset.k);if(!it)return;const clean={...it};delete clean.subs;delete clean.srd;
    if(t==='spells'&&clean.cls){clean.classes=Object.entries(LET).filter(([n,l])=>clean.cls.includes(l)).map(([n])=>n);delete clean.cls}
    ui.edit={type:t,orig:a==='libEdit'?b.dataset.k:null,vals:toForm(t,clean)};ui.msg='';render();window.scrollTo(0,0)}
  else if(a==='libCancel'){const ret=ui.edit?.ret;ui.edit=null;ui.msg='';if(ret)ui.tab=ret;render()}

    const k=keyOf(t,o);if(t==='magic'&&ui.edit.orig&&ui.edit.orig!==o.name)store.chars.forEach(c=>(c.magic||[]).forEach(e=>{if(e.name===ui.edit.orig)e.name=o.name}));
    if(t==='items'&&ui.edit.orig&&ui.edit.orig!==o.name)store.chars.forEach(c=>(c.inv||[]).forEach(e=>{if(e.name===ui.edit.orig)e.name=o.name}));
    lib[t]=lib[t].filter(i=>keyOf(t,i)!==k&&keyOf(t,i)!==ui.edit.orig);lib[t].push(o);const ret=ui.edit.ret;ui.edit=null;ui.msg='';if(ret){ui.tab=ret;toast(`Saved ${o.name}.`)}commit()}
  else if(a==='libDel'){const k=b.dataset.k;if(ui.confirm!=='del:'+k){ui.confirm='del:'+k;render();return}lib[ui.libType]=lib[ui.libType].filter(i=>keyOf(ui.libType,i)!==k);ui.confirm=null;commit()}
  else if(a==='copy'){const ta=document.getElementById(b.dataset.t);const done=()=>{b.textContent='Copied'};try{navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select();b.textContent='Selected, copy manually'})}catch(err){ta.select();b.textContent='Selected, copy manually'}}
  else if(a==='import'){importText(document.getElementById('imp').value)}

  else if(a==='bkSave'){saveBackup(b.dataset.k==='one')}

});
try{document.documentElement.style.fontSize=ui.fs+'px'}catch(e){}
if(!FILE_MODE)syncInit();

  f.text().then(txt=>{const before=new Set(store.chars.map(c=>c.id));const fresh=store.chars.filter(c=>c.fresh);ui.fmLoading=true;importText(txt);const nw=store.chars.find(c=>!before.has(c.id))||(()=>{try{const d=JSON.parse(txt);const id=(d.chars||[d])[0]?.id;return store.chars.find(c=>c.id===id)}catch(e){return null}})();
